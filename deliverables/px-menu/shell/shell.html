<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Menu</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden;
    font-family: Arial, Helvetica, sans-serif; background: #3b6ea5; }
  .shell { display: flex; flex-direction: column; height: 100%; }

  .navbar { display: flex; align-items: stretch; background: #3b6ea5; height: 56px; flex: 0 0 56px; }
  .navbar .brand { display: flex; align-items: center; padding: 0 26px 0 20px; }
  .navbar .brand img { height: 30px; width: auto; display: block; }
  .navbar > .item { position: relative; }
  .navbar > .item > a,
  .navbar > .item > span {
    display: flex; align-items: center; height: 56px; padding: 0 20px;
    color: #fff; font-size: 13px; font-weight: bold;
    text-decoration: none; cursor: pointer; user-select: none; white-space: nowrap;
    border-bottom: 3px solid transparent;
  }
  .navbar > .item:hover > a,
  .navbar > .item:hover > span { background: #33608f; }
  .navbar > .item.open > span { background: #2b5279; border-bottom-color: #e8b23a; }
  .navbar > .item.active > a,
  .navbar > .item.active > span { background: #2b5279; border-bottom-color: #e8b23a; }
  .caret { margin-left: 8px; border-top: 4px solid #fff; border-left: 4px solid transparent; border-right: 4px solid transparent; }

  .dropdown { display: none; position: absolute; top: 56px; left: 0; min-width: 220px; background: #fff;
    border: 1px solid #d0d5dc; box-shadow: 0 6px 14px rgba(0,0,0,.16); z-index: 1000; padding: 6px 0; }
  .item.open .dropdown { display: block; }
  .dropdown a { display: block; padding: 9px 20px; color: #24303d; font-size: 13px; text-decoration: none; }
  .dropdown a:hover { background: #eef4fb; color: #1a5fa4; }
  .dropdown a.active { background: #eef4fb; color: #1a5fa4; font-weight: bold; }
  .divider { height: 1px; background: #e2e6eb; margin: 6px 0; }

  /* The content frame owns everything below the navbar. Views loaded here
     never see the menu, so the menu never has to be repeated in them. */
  .content { flex: 1 1 auto; border: 0; width: 100%; display: block; background: #e8ebf0; }
</style>
</head>

<script>
/* ES5 on purpose: bajaux and the Workbench browser stay on ES5 (see B204). */
(function () {
  var STORE_KEY = 'cadlan.menu.active';
  var HOME = 'file:^px/Vistas/Planta.px';
  var items = document.querySelectorAll('.navbar > .item');
  var menus = document.querySelectorAll('.item[data-menu]');
  var links = document.querySelectorAll('.navbar a');
  var frame = document.getElementById('content');

  function hasClass(el, c) { return (' ' + el.className + ' ').indexOf(' ' + c + ' ') !== -1; }
  function addClass(el, c) { if (!hasClass(el, c)) { el.className = el.className + ' ' + c; } }
  function removeClass(el, c) {
    el.className = (' ' + el.className + ' ')
      .replace(' ' + c + ' ', ' ')
      .replace(/^\s+|\s+$/g, '');
  }

  function closeAll() {
    for (var i = 0; i < menus.length; i++) { removeClass(menus[i], 'open'); }
  }

  /* The navbar is never reloaded by navigation (the iframe is), so the highlight
     survives on its own. sessionStorage only covers a manual F5 of the shell. */
  function remember(href) {
    try { window.sessionStorage.setItem(STORE_KEY, href); } catch (e) {}
  }
  function recall() {
    try { return window.sessionStorage.getItem(STORE_KEY); } catch (e) { return null; }
  }

  function markActive(href) {
    var i, parent;
    for (i = 0; i < items.length; i++) { removeClass(items[i], 'active'); }
    for (i = 0; i < links.length; i++) { removeClass(links[i], 'active'); }
    if (!href) { return; }
    for (i = 0; i < links.length; i++) {
      if (links[i].getAttribute('data-ord') === href) {
        addClass(links[i], 'active');
        parent = links[i];
        while (parent && !hasClass(parent, 'item')) { parent = parent.parentNode; }
        if (parent) { addClass(parent, 'active'); }
        return;
      }
    }
  }

  for (var i = 0; i < menus.length; i++) {
    (function (item) {
      var label = item.querySelector('span');
      label.onclick = function (e) {
        e.stopPropagation();
        var wasOpen = hasClass(item, 'open');
        closeAll();
        if (!wasOpen) { addClass(item, 'open'); }
      };
    })(menus[i]);
  }

  /* Href2Ord (baja/com/tridium/util/Href2Ord.java:21-32) decides how a link is
     read, and the two hosts disagree:

       - real browser  -> the page is plain HTML; links must be URLs: /ord/<encoded>
       - BWebBrowser   -> Niagara intercepts the href. isAlreadyOrd() tests the text
                          BEFORE the first ':'. For "/ord/file:^x" that text is
                          "/ord/file", which is not a registered ord scheme, so the
                          href gets wrapped in file: and merged onto the widget's own
                          ord -> file:/ord/file:%255E...  (the 404/403 seen in the field)

     So the ord is the single source of truth in data-ord, and the href is built for
     whichever host is actually rendering the page. */
  var isBrowser = /^https?:$/.test(window.location.protocol);

  /* fullScreen is an Hx VIEW PARAMETER, not a plain query arg:
       BHxProfile.java:173  fullScreenKey = "fullScreen"
       BHxProfile.java:290  isFullScreen = "true".equals(op.getViewParameter(fullScreenKey, "false"))
     It defaults to false, which is why the Px View tab strip, the view selector and
     the icon rail show up inside the content frame. Being a view parameter it must
     follow a view query, so an ord without one gets an empty |view: appended. */
  function ordToHref(ord) {
    if (!isBrowser) { return ord; }               /* raw ord: passes isAlreadyOrd() */
    var withView = ord.indexOf('|view:') !== -1 ? ord : ord + '|view:';
    return '/ord/' + withView.replace(/\|/g, '%7C').replace(/\^/g, '%5E') + '?fullScreen=true';
  }

  for (var j = 0; j < links.length; j++) {
    (function (a) {
      var ord = a.getAttribute('data-ord');
      a.href = ordToHref(ord);
      a.onclick = function () {
        remember(ord);
        markActive(ord);
        closeAll();
      };
    })(links[j]);
  }

  document.onclick = function () { closeAll(); };

  /* Restore the last view after a manual reload of the shell. */
  var last = recall() || HOME;
  frame.src = ordToHref(last);
  markActive(last);
})();
</script>
